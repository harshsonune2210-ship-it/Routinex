<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#07080b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="#090a0f"/>
  <circle cx="256" cy="256" r="230" fill="url(#bgGlow)"/>

  <!-- Outer Precision Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#1f2430" stroke-width="8" stroke-dasharray="6 8"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#emeraldGrad)" stroke-width="12" stroke-linecap="round" stroke-dasharray="1130" stroke-dashoffset="280" filter="url(#neonGlow)"/>

  <!-- Inner Target Hexagon/Shield -->
  <polygon points="256,120 376,190 376,322 256,392 136,322 136,190" fill="#12151e" stroke="#2a3244" stroke-width="4"/>

  <!-- Tactical Crosshair Dots -->
  <circle cx="256" cy="120" r="5" fill="#10b981"/>
  <circle cx="376" cy="190" r="5" fill="#10b981"/>
  <circle cx="376" cy="322" r="5" fill="#10b981"/>
  <circle cx="256" cy="392" r="5" fill="#10b981"/>
  <circle cx="136" cy="322" r="5" fill="#10b981"/>
  <circle cx="136" cy="190" r="5" fill="#10b981"/>

  <!-- Central Dynamic Flame & Checkmark Glyph -->
  <path d="M256 160 C275 210 320 235 320 290 C320 335 290 365 256 365 C222 365 192 335 192 290 C192 250 220 220 232 185 C236 210 250 230 262 238 C266 220 262 195 256 160 Z" fill="url(#flameGrad)" filter="url(#neonGlow)"/>

  <!-- Sharp Target Checkmark Accent -->
  <path d="M216 280 L244 308 L296 248" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
